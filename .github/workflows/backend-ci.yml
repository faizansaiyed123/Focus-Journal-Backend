name: Backend CI

on:
  push:
    branches:
      - main
      - "backend/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: focus_journal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d focus_journal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/focus_journal_test
      SECRET_KEY: ci-only-secret-key-replace-with-at-least-32-characters
      SESSION_SECRET_KEY: ci-only-session-secret-replace-with-32-characters
      SESSION_COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:5173
      FRONTEND_BASE_URL: http://localhost:5173
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Inspect Python dependency advisories
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt --format json > /tmp/pip-audit.json || true
          python -c "import json; data=json.load(open('/tmp/pip-audit.json')); [print(f\"{dep.get('name')}=={dep.get('version')}: {', '.join(v.get('id', 'unknown') + ' fix=' + ','.join(v.get('fix_versions', [])) for v in dep.get('vulns', []))}\") for dep in data.get('dependencies', []) if dep.get('vulns')]"
      - name: Compile backend
        run: python -m compileall -q .
      - name: Run API and domain tests
        run: pytest -q
